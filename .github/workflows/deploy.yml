name: CI/CD
 
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
 
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
 
permissions:
  contents: read
 
jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Lint HTML
        run: npx --yes htmlhint index.html
 
      - name: Check JavaScript syntax
        run: node --check scripts.js
 
      - name: Prepare site folder
        run: |
          mkdir dist
          cp index.html scripts.js styles.css dist/
 
      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
 
  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
 